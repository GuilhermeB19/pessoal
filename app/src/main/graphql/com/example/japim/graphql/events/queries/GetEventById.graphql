query GetEventById($id : ID!){
    event(id : $id){
        id
        name
        short_description
        description
        path_img
        is_payment
        value
        max_participants
        max_volunteers
        date_start
        hour_start
        date_end
        hour_end
        workload
        created_by {
            id
            name
        }
        speakers {
            id
            name
        }
        status_event {
            id
            name
            initialism
            description
        }
        total_participants
        total_volunteers
        in_event
    }

}